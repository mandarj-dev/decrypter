<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Decrypt AES-encrypted data in your browser" />
  <meta name="theme-color" content="#1a1b26" />
  <title>Decrypter</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Decrypter</h1>
      <p>AES decryption — runs entirely in your browser</p>
    </header>

    <main class="main">
      <section class="panel">
        <form id="decrypt-form">
          <label class="field">
            <span>Secret key</span>
            <div class="key-row">
              <input type="password" id="key" autocomplete="off" placeholder="Enter secret key" required />
              <button type="button" class="btn-text" id="toggle-key">Show</button>
            </div>
          </label>

          <label class="field">
            <span>Encrypted data (Base64)</span>
            <textarea id="data" rows="6" placeholder="Paste encrypted response…" required></textarea>
          </label>

          <div class="actions">
            <button class="btn btn-primary" type="submit" id="decrypt-btn">Decrypt</button>
            <button class="btn" type="button" id="paste-btn">Paste</button>
            <button class="btn" type="button" id="clear-btn">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel panel-output">
        <div class="panel-head">
          <h2>Output</h2>
          <div class="actions actions-inline">
            <button class="btn btn-sm" type="button" id="format-btn">Format</button>
            <button class="btn btn-sm" type="button" id="copy-btn">Copy</button>
          </div>
        </div>
        <pre id="output"><code id="output-code"></code></pre>
        <p class="status" id="status">Ready</p>
      </section>

      <section class="panel panel-history">
        <div class="panel-head">
          <h2>Session history</h2>
          <button class="btn btn-sm btn-ghost" type="button" id="clear-history-btn" hidden>Clear</button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">Decrypted results appear here for this session</li>
        </ul>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
